# Builds the app and publishes dist/ to GitHub Pages on every push to main. The same checks as ci.yml
# (check.yml: types, unit tests, both builds and the browser smoke tests) gate the deploy: the build job needs them.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read # the check needs no more; pages and id-token are for the deploy

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # With the repository variable PAGES_DOMAIN set (the app's own domain, with its DNS record pointing at GitHub Pages),
      # the app builds at the root and names that host as its own origin, where My list may be stored; without it, the
      # Pages path under the shared salientform.github.io origin, where secrets stay in memory (src/state/origin.ts).
      - run: pnpm build
        env:
          BASE_PATH: ${{ vars.PAGES_DOMAIN && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_OWN_HOSTS: ${{ vars.PAGES_DOMAIN }}
      - if: ${{ vars.PAGES_DOMAIN }}
        run: echo "${{ vars.PAGES_DOMAIN }}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
