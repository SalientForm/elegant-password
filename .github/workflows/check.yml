# The checks, once: types, the unit tests, both builds and the browser smoke tests. Called by ci.yml on every
# branch push and pull request, and by pages.yml before a deploy. Callers own the triggers and the concurrency.
name: Check

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # never more than reading the repository, whatever the caller grants
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:cli
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e # builds the app itself and serves it on this project's ports
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
