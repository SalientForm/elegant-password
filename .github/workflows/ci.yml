# Checks every push and pull request: types, the unit tests, both builds and the browser smoke tests
# (which pages.yml leaves to developers' machines). The deploy workflow runs the unit tests again on main.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          NODE_OPTIONS: --max-old-space-size=4096 # generate.test.ts runs out of the default heap on the runner
      - run: pnpm build:cli
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e # builds the app itself and serves it on this project's ports
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
