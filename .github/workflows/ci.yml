# Checks every push to a branch and every pull request: types, the unit tests, both builds and the browser
# smoke tests, all in check.yml. Pushes to main run the same checks from pages.yml, before anything is deployed.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml
